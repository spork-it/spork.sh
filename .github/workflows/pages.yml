name: Build and deploy spork.sh

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: spork.it

      - name: Install documented package versions
        run: |
          python -m pip install \
            "spork-lang==0.6.1" \
            "spork-runtime==0.1.1" \
            "spork-pds==0.1.4" \
            "spork-state==0.2.1" \
            "spork-site==0.1.1"

      - name: Synchronize project environment
        run: spork sync

      - name: Check Spork source
        run: spork check

      - name: Run site tests
        run: spork test

      - name: Verify documentation examples
        run: python tools/verify_docs.py

      - name: Test installer safety and rollback
        run: sh tests/install_test.sh

      - name: Cache Pyodide cross-build environment
        uses: actions/cache@v4
        with:
          path: ~/.cache/pyodide-build
          key: pyodide-${{ runner.os }}-${{ runner.arch }}-314.0.6-emscripten-5.0.3-build-0.39.0

      - name: Install playground build tools
        run: |
          python -m pip install \
            "pyodide-build==0.39.0" \
            "setuptools==84.0.0" \
            "wheel==0.48.0"
          pyodide xbuildenv install 314.0.6
          pyodide xbuildenv install-emscripten

      - name: Build browser runtime
        run: |
          test ! -e static/playground-runtime
          python tools/build_playground_runtime.py

      - name: Validate site plan
        run: spork site check

      - name: Build production site
        run: |
          spork site build
          cp -R build/playground-runtime/assets/playground-runtime public/

      - name: Verify deterministic rebuild
        run: |
          find public -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/spork-site-before.sha256
          spork site build
          cp -R build/playground-runtime/assets/playground-runtime public/
          find public -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/spork-site-after.sha256
          diff -u /tmp/spork-site-before.sha256 /tmp/spork-site-after.sha256

      - name: Verify generated links and fragments
        run: python tools/verify_site.py

      - name: Verify playground assets
        run: python tools/verify_playground_assets.py

      - name: Verify Pages output
        run: |
          test "$(cat public/CNAME)" = "spork.sh"
          test -f public/index.html
          test -f public/404.html
          test -f public/sitemap.xml
          test -f public/robots.txt
          test -f public/docs/search.json
          test -f public/docs-search.js
          test -f public/play/index.html
          test -f public/playground.js
          test -f public/playground-worker.js
          test -f public/playground-runtime/runtime.json
          test -f public/install
          test -f public/install.sha256
          sh -n public/install
          (cd public && sha256sum -c install.sha256)

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
